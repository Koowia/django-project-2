<div class="cart-empty">
    <svg class="cart-empty__star" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4l3.8 22.2L58 32l-22.2 5.8L32 60l-3.8-22.2L6 32l22.2-5.8L32 4z"></path>
        <path d="M32 19v26M19 32h26"></path>
    </svg>
    <h3>КОРЗИНА ПУСТА</h3>
    <p>Добавьте товары, чтобы<br>продолжить покупки.</p>
    <a class="cart-empty__button"
       href="{% url 'main:catalog_all' %}"
       hx-get="{% url 'main:catalog_all' %}"
       hx-target="#main-content"
       hx-push-url="true"
       onclick="closeCart()">
        ПЕРЕЙТИ К КАТАЛОГУ <span aria-hidden="true">→</span>
    </a>
</div>
