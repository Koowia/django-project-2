{% load main_tags %}

<div class="cart-total">
    <span>ИТОГО</span>
    <strong>{{ cart.subtotal|format_price }}</strong>
</div>

<a class="cart-checkout"
   href="{% url 'orders:checkout' %}"
   hx-get="{% url 'orders:checkout' %}"
   hx-target="#main-content"
   hx-push-url="true"
   onclick="closeCart()">
    ОФОРМИТЬ ЗАКАЗ <span aria-hidden="true">→</span>
</a>
